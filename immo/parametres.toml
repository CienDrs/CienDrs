# Paramètres de l'outil (cahier des charges §5 à §7).
# Taux fiscaux et ratios INDICATIFS : à valider par un notaire / fiscaliste et à calibrer localement.

[zone]
centre_nom = "Grand-Place de Mons"
centre_lat = 50.4542
centre_lon = 3.9517
rayon_km = 10

[strategie]
decote_cible = 0.20              # achat visé à 20 % sous la valeur en l'état (R2)
tolerance_decote = 0.0           # ex. 0.02 accepte un achat à 82 % de la valeur
plus_value_min = 30000           # plus-value nette minimale, scénario prudent (R1)
marge_min_pct_revient = 0.15     # R3 (recommandé)
duree_max_mois = 12              # R7 (recommandé)

[acquisition]
regime = "personne_physique"     # ou "marchand_de_biens"
droits_personne_physique = 0.125
droits_marchand_de_biens = 0.05
frais_notaire_fixes = 3000       # honoraires + frais administratifs + TVA (forfait indicatif)

[portage]
# Si portage_mensuel > 0, il remplace le calcul détaillé ci-dessous.
portage_mensuel = 0
taux_interet = 0.035
quotite_financee = 0.80          # part du prix de revient financée par emprunt
frais_acte_credit = 0.02         # en % du montant emprunté, payé une fois
indexation_revenu_cadastral = 2.2   # coefficient d'indexation du RC (à vérifier chaque année)
taux_precompte_regional = 0.0125
centimes_additionnels = 2600     # centimes additionnels communaux + provinciaux (à vérifier par commune)
charges_mensuelles = 150         # assurance incendie, énergie, eau, abonnements

[revente]
commission_agence = 0.03
tva_commission = 0.21
frais_fixes = 800                # PEB, contrôle électrique, attestation de sol, renseignements urbanistiques

[travaux]
duree_defaut_mois = 6
delai_revente_mois = 3           # délai entre la fin des travaux et l'acte de revente
supplement_par_classe_peb_m2 = 40   # €/m² par classe PEB gagnée, en plus du niveau de rénovation

[travaux.niveaux]   # €/m² TVAC [bas, haut] — à calibrer avec les devis locaux
rafraichissement = [250, 500]
renovation_moyenne = [600, 1100]
renovation_lourde = [1100, 1800]

[travaux.imprevus]
rafraichissement = 0.10
renovation_moyenne = 0.15
renovation_lourde = 0.20

[travaux.niveau_par_etat]
"Comme neuf" = "aucun"
"Fraîchement rénové" = "aucun"
"Bon" = "rafraichissement"
"À rafraîchir" = "rafraichissement"
"À rénover" = "renovation_moyenne"
"À restaurer" = "renovation_lourde"

[scenarios.prudent]
revente = -0.05
travaux = 0.20
mois = 3

[scenarios.optimiste]
revente = 0.03
travaux = -0.10
mois = -1

[estimation]
marge_negociation = 0.05         # prix demandé -> prix de vente (B3)
min_comparables = 5
peb_classe_cible_defaut = "C"
# Coefficients de valeur par état (base « Bon » = 1), pour ramener chaque comparable à l'état du bien (B6)
[estimation.coef_etat]
"Comme neuf" = 1.25
"Fraîchement rénové" = 1.20
"Bon" = 1.00
"À rafraîchir" = 0.88
"À rénover" = 0.75
"À restaurer" = 0.60

[fiscalite]
taux_plus_value_pp = 0.165       # plus-value sur immeuble bâti revendu dans les 5 ans
additionnels_communaux = 0.075
taux_isoc = 0.25

[reperage]
# Phase 1 : repérage des biens sous la valeur du marché (module R)
reference = "mediane"            # "mediane" ou "moyenne" du prix/m² des biens similaires
seuil = 0.20                     # GO si le prix/m² est au moins 20 % sous la référence
rayon_km = 3                     # rayon de départ de la recherche de comparables (élargi si trop peu)
min_comparables = 5

[collecte]
# Collecte automatique (version finale). Sources activées, dans l'ordre :
#  - "dossier" : importe les pages d'annonces (.html) et fichiers CSV déposés dans dossier_import
#  - "api"     : accès officiel aux données (à configurer quand un accès est obtenu)
sources = ["dossier"]
dossier_import = "data/import"
intervalle_minutes = 60
api_url = ""
api_cle_variable = "IMMO_API_CLE"   # nom de la variable d'environnement contenant la clé

[statbel]
# Prix médians de vente par commune : téléchargés automatiquement par l'application.
frequence_jours = 30             # nouvelle tentative de mise à jour au plus tous les N jours
zone_indice = "Hainaut"          # zone de l'indice d'évolution des prix calculé à partir des médianes
# Sources essayées dans l'ordre jusqu'à la première qui fonctionne.
[[statbel.sources]]
nom = "WalStat / Open Data Wallonie-Bruxelles — Prix de l'immobilier résidentiel (données annuelles, Statbel)"
type = "fichier"
url = "https://www.odwb.be/api/explore/v2.1/catalog/datasets/234002/exports/csv?delimiter=%3B&lang=fr"

[risques]
# Services ArcGIS REST du géoportail de la Wallonie (https://geoservices.wallonie.be/arcgis/rest/services),
# interrogés au point du bien par l'opération « identify » sur toutes leurs couches.
# En cas d'échec, la fiche le signale et les risques peuvent être cochés à la main.
[[risques.couches]]
cle = "alea_inondation"
libelle = "Aléa d'inondation"
url = "https://geoservices.wallonie.be/arcgis/rest/services/EAU/ALEA_INOND/MapServer"
bloquant = true
non_bloquant_si = ["faible", "tres faible"]   # seul un aléa moyen ou élevé est bloquant

[[risques.couches]]
cle = "contraintes_sous_sol"
libelle = "Contraintes du sous-sol (puits de mine, minières, carrières souterraines, karst)"
url = "https://geoservices.wallonie.be/arcgis/rest/services/SOL_SOUS_SOL/CONSULT_SSOL/MapServer"
bloquant = true

[[risques.couches]]
cle = "plan_de_secteur"
libelle = "Plan de secteur (affectation)"
url = "https://geoservices.wallonie.be/arcgis/rest/services/AMENAGEMENT_TERRITOIRE/PDS/MapServer"
bloquant = false
