[project]
name = "analyse-immo"
version = "1.0.0"
description = "Outil d'aide à la décision pour l'achat-rénovation-revente de maisons autour de Mons (Wallonie)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.40",
    "plotly>=5.24",
    "anthropic>=0.70",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
